[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aptahmm"
version = "1.0.0"
description = "Hidden Markov model based DNA aptamer sequence generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ram Kothandan", email = "ram.k.bt@kct.ac.in" },
]
keywords = [
    "aptamer",
    "hidden Markov model",
    "DNA",
    "SELEX",
    "sequence generation",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aptahmm = "aptahmm.cli:main"

[tool.setuptools]
packages = ["aptahmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
